<div class="bg-white rounded-2xl h-fit shadow-sm p-8 py-5
                        starting:translate-x-5 translate-x-0 starting:opacity-0 opacity-100 duration-750">
    <p class="uppercase text-xs font-semibold text-red-900 mb-3">abilities</p>
    <div class="flex flex-col gap-3">
        @for (a of pokemon()?.abilities; track $index) {
        <p class="capitalize bg-gray-100 rounded-2xl px-5 py-3 flex flex-row justify-between place-items-center gap-12 w-auto">
            <span class="font-semibold">{{ a.ability.name.replace('-',' ') }}</span>
            @if (a.is_hidden) {
            <span class="font-semibold text-xs uppercase text-gray-800">hidden</span>
            } @else {
            <span class="font-semibold text-xs uppercase text-gray-800">standard</span>
            }
        </p>
        }
    </div>
</div>
