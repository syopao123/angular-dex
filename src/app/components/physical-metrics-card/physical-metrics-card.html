<div class="bg-white rounded-2xl h-fit shadow-sm p-8 py-5
                        starting:translate-x-5 translate-x-0 starting:opacity-0 opacity-100 duration-500">

    <p class="uppercase text-xs font-semibold text-red-900 mb-3">physical metrics</p>

    <div class="flex flex-row gap-2">

        <!-- Height -->
        <div class="bg-gray-100 rounded-2xl p-3 px-6 text-sm w-full py-3">
            <p class="mb-2 uppercase text-gray-600 text-xs font-semibold">height</p>
            <p class="flex place-items-center gap-3">
                <span class="font-extrabold text-xl">{{ getComputedMetric(pokemon()?.height) }}</span>
                <span>m</span>
            </p>
        </div>

        <!-- Weight -->
        <div class="bg-gray-100 rounded-2xl p-3 px-6 text-sm w-full py-3">
            <p class="mb-2 uppercase text-gray-600 text-xs font-semibold">weight</p>
            <p class="flex place-items-center gap-3">
                <span class="font-extrabold text-xl">{{ getComputedMetric(pokemon()?.weight) }}</span>
                <span>kg</span>
            </p>
        </div>
    </div>

</div>
