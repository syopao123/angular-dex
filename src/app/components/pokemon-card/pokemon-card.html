@if (pokemon())
{
<!-- Card -->
<div class="px-6 py-8 pb-12 grid rounded-3xl bg-white shadow-xl w-auto md:w-md
        starting:translate-y-10 starting:opacity-0 translate-y-0 duration-750">

    <img
        class="p-5 mb-5"
        [src]="pokemon()?.sprite || ''"
        [alt]="pokemon()?.name">

    <div class="text-center mb-2">
        <p class="text-3xl font-extrabold first-letter:uppercase">
            {{ pokemon()?.name }}
        </p>
    </div>

    <div class="mb-10">
        <div class="flex gap-1 flex-wrap justify-center">
            @for (type of pokemon()?.types; track $index) {
            <span class="px-4 py-1 rounded-3xl border-gray-200 capitalize"
                [class]="getTypeBadgeColor(type)">
                {{ type }}
            </span>
            }
        </div>
    </div>

    <div class="bg-gray-100 rounded-2xl p-5 mb-5 text-center">
        <p>
            {{ pokemon()?.description }}
        </p>
    </div>

    <!-- <div class="text-center">
        <p class="font-semibold text-gray-500 capitalize">genus</p>
    </div> -->

</div>
}
