<div class="bg-white p-8 rounded-2xl shadow-sm
                starting:-translate-x-4 translate-x-0 starting:opacity-0 opacity-100 duration-500">

    <div class="cursor-pointer place-items-end" (click)="favoritePokemon()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" 
            class="size-8 text-yellow-400 hover:fill-yellow-400 active:fill-yellow-900 active:text-yellow-900 duration-250"
            [class]="isFavorite() ? 'fill-yellow-400' : ''">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
        </svg>
    </div>

    @if (pokemon()?.name !== pokemon()?.species_name) {
    <div class="text-center mb-8">
        <span class="capitalize text-md text-gray-500 py-1 px-3 rounded-xl">
            {{ pokemon()?.name.replace('-', ' ') }}
        </span>
    </div>
    }

    <img class="rounded-2xl mb-5 w-sm" [src]="pokemon()?.sprite" [alt]="pokemon()?.name">

    <div class="flex place-items-center justify-between mb-2">
        <p class="capitalize font-bold text-3xl">{{ pokemon()?.species_name }}</p>
        <p class="font-semibold text-gray-400">#{{ pokemon()?.id }}</p>
    </div>

    <div class="mb-5">
        <p class="capitalize text-gray-500 text-sm">The {{ pokemon()?.genus }}</p>
    </div>

    <div class="flex justify-between place-items-start">

        <!-- Types -->
        <div class="flex flex-wrap gap-1">
            @for (type of pokemon()?.types; track $index) {
            <span [class]="getTypeBadgeColor(type)" class="px-3 py-1 capitalize rounded-2xl text-sm">{{ type }}</span>
            }
        </div>

        <!-- Generation -->
        <div>
            <span class="font-semibold text-gray-500 text-xs bg-gray-300 px-3 py-1 rounded-xl uppercase">
                {{ pokemon()?.generation.replace('-', ' ') }}
            </span>
        </div>
    </div>

</div>
