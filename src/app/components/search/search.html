<div class="text-center pt-48 place-items-center">

    <p class="mb-5 text-5xl md:text-6xl font-bold">
        <span>Angular </span>
        <span class="text-red-600">Dex</span>
    </p>

    <p>Search any Pokémon by name</p>

    <form class="bg-white shadow-sm mb-5 mt-5 py-5 w-xs px-6 md:w-sm rounded-4xl flex">

        <input [(ngModel)]="searchName" name="searchedPokemon" type="text" autocomplete="off"
            class="focus:outline-0 w-full"
            placeholder="e.g. Pikachu">

        @if (isSearching()) {
        <div>
            <div class="h-6 w-6 animate-spin rounded-full border-3 border-blue-500 border-t-transparent"></div>
        </div>
        }

    </form>

    @if (filteredPokemon().length > 0) {
    <ul class="bg-white rounded-lg w-72 flex flex-col gap-3 px-3 py-4 overflow-auto
            starting:max-h-0 max-h-80 starting:opacity-0 opacity-100 duration-500">
        @for (pokemon of filteredPokemon(); track pokemon.name) {
            <span (click)="searchPokemon(pokemon.name, pokemon.url)" class="capitalize hover:bg-gray-200 py-2 cursor-pointer">
                {{ pokemon.name }}
            </span>
        }
    </ul>
    }



</div>
