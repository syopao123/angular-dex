<div class="w-full min-h-screen flex flex-col items-center gap-12 pb-24">

    @if (!selectedPokemon()) {

    <app-search (pokemon)="pokemonData.set($event)" />

    @if (pokemonData(); as data) {

    <div class="p-5 grid gap-10">
        <app-pokemon-card [pokemon]="data" (click)="onSelectPokemon()" />
    </div>

    }

    } @else {

        <app-pokemon-info [pokemon]="selectedPokemon()" (resetSearch)="selectedPokemon.set(null)" />

    }

</div>
