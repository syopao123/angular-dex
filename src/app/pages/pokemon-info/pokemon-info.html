<div class="w-full min-h-screen flex flex-col pb-24">

    @if (!pokemon()) {

    <div class="place-items-center pt-36 min-h-screen">
        <div class="h-12 w-12 animate-spin rounded-full border-5 border-blue-500 border-t-transparent"></div>
    </div>

    } @else {

    <div class="mx-auto w-full max-w-6xl px-4">

        <!-- Back to search -->
        <div class="flex justify-start mt-12 place-items-center mb-6
                starting:opacity-0 starting:-translate-x-4 translate-x-0 opacity-100 duration-500">

            <span [routerLink]="redirectUrl()" class="flex place-items-center gap-2 bg-white rounded-3xl px-4 py-2 cursor-pointer text-sm
                hover:bg-gray-100 duration-250 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8" />
                </svg>
                <span class="md:flex gap-1">
                    Back
                    @if (isFromFavorites()) {
                        <span class="hidden md:block">to Favorites</span>
                    } @else {
                        <span class="hidden md:block">to Search</span>
                    }
                </span>
            </span>

        </div>

        <div class="grid grid-cols-1 md:grid-cols-[30rem_1fr] gap-6">

            <!-- Image Card -->
            <app-pokemon-image-card [pokemon]="pokemon()" />

            <div>
                <!-- Base Combat Stats Card -->
                <app-base-combat-stats-card [pokemon]="pokemon()" />

                <div class="grid grid-cols-1 lg:grid-cols-[auto_1fr] gap-4">

                    <!-- Physical Metrics Card -->
                    <app-physical-metrics-card [pokemon]="pokemon()" />

                    <!-- Abilities Card -->
                    <app-abilities-card [pokemon]="pokemon()" />

                </div>
            </div>

            <!-- Entry Log Card -->
            <app-entry-log-card [pokemon]="pokemon()" class="col-span-1 md:col-span-2" />

        </div>
    </div>
    }
</div>
